# Harbor run: tunable_coupler_cz_netzero with Claude Code (claude-opus-4-8).
# Build images: docker build -t qiqcbench-agent docker/agent/
#   uv run python tools/build_qsim_images.py --tasks tunable_coupler_cz_netzero
# Auth: export ANTHROPIC_API_KEY=<key> or ANTHROPIC_AUTH_TOKEN=<token>, plus ANTHROPIC_BASE_URL
#   for an Anthropic-compatible endpoint.
# Run: harbor run -c configs/harbor/tunable_coupler_cz_netzero_claude.yaml
jobs_dir: jobs
n_attempts: 1
orchestrator:
  type: local
  n_concurrent_trials: 1
  quiet: false
environment:
  type: docker
  force_build: false
  delete: false
  env:
    - QSIM_BACKEND_MODE=simulator
    - ANTHROPIC_BASE_URL=${ANTHROPIC_BASE_URL}
    - ANTHROPIC_AUTH_TOKEN=${ANTHROPIC_AUTH_TOKEN}
agents:
  - name: claude-code
    model_name: claude-opus-4-8
    kwargs:
      max_thinking_tokens: 31999
      max_turns: 300
datasets:
  - path: harbor_tasks
    task_names:
      - tunable_coupler_cz_netzero
