[project]
name = "qiqcbench"
version = "0.0.1"
description = "Benchmark suite for AI systems performing experimental quantum science."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Jiaqi Cai" }]

dependencies = [
    "pydantic>=2.6",
    "qutip>=5.0",
    "numpy>=1.26",
    "scipy>=1.11",
    "ruamel.yaml>=0.18",
    "pathspec==1.1.1",
    # FastMCP import paths used by qsim are the stable 1.x SDK surface.
    "mcp>=1.2,<2",
    "typer>=0.12",
    "uvicorn>=0.27",
    "starlette>=0.36",
    "python-dotenv>=1.0",
    # Circuit-level stabilizer simulation for the surface_code_lattice_surgery qtype
    # (the engine samples detection events from noisy stim circuits at runtime).
    "stim>=1.14",
    # Fixed firmware matching for syndrome-feedback surface-code devices.  The
    # agent cannot configure or import this decoder; qsim applies it to the raw
    # detector record produced by the same DEM faults.
    "pymatching>=2.2",
]

[project.optional-dependencies]
live = [
    "qiskit>=1.0",
    "qiskit-ibm-runtime>=0.40",
]
dev = [
    "ruff>=0.4",
    "qiqcbench[live]",
]

[project.scripts]
qiqcbench = "qiqcbench.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qiqcbench"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
